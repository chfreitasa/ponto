<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para adaptação mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Ponto Diário</title>
    <style>
        :root {
            --primary-color: #004d40;
            --secondary-color: #00796b;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        
        .container {
            background: #fff;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
            font-size: 1.4em;
        }

        /* Estilo do Relógio */
        .clock-box {
            background: #e0f2f1;
            color: var(--primary-color);
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 2.2em;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.95em;
        }

        /* Inputs adaptados para touch */
        input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.2em;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        /* Botões adaptados para touch */
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover, button:active {
            background-color: var(--secondary-color);
        }

        .btn-danger {
            background-color: #d32f2f;
            margin-top: 20px;
            font-size: 1em;
        }

        .btn-danger:hover, .btn-danger:active {
            background-color: #b71c1c;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e0f2f1;
            border-left: 5px solid var(--secondary-color);
            border-radius: 8px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-title {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .history-section {
            margin-top: 30px;
        }

        .history-section h3 {
            font-size: 1.1em;
            color: var(--primary-color);
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        /* Container scrollável para a tabela não quebrar o layout mobile */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
            min-width: 400px; /* Garante que a tabela tenha um tamanho legível antes de gerar o scroll */
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px 8px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background-color: #f0f0f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ajustes específicos para telas muito pequenas */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            .clock-box {
                font-size: 1.8em;
                padding: 10px;
            }
            h2 {
                font-size: 1.2em;
            }
            input[type="time"], button {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Controle de Ponto Diário</h2>
        
        <!-- Relógio em tempo real -->
        <div class="clock-box" id="relogio">00:00:00</div>
        
        <div class="form-group">
            <label for="entrada">Horário de Entrada (Chegada):</label>
            <input type="time" id="entrada" value="07:30" required>
        </div>
        
        <div class="form-group">
            <label for="saidaAlmoco">Saída para o Almoço:</label>
            <input type="time" id="saidaAlmoco" value="12:00" required>
        </div>

        <div class="form-group">
            <label for="retornoAlmoco">Retorno do Almoço:</label>
            <input type="time" id="retornoAlmoco" value="13:00" required>
        </div>

        <button onclick="calcularESalvar()">Calcular Saída Exata</button>

        <div id="resultadoContainer" class="result-box" style="display: none;">
            <div class="result-title">Sair às: <span id="horaSaidaCalculada">--:--</span></div>
        </div>

        <div class="history-section">
            <h3>Histórico Salvo</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Entrada</th>
                            <th>Saída Almoço</th>
                            <th>Retorno</th>
                            <th>Saída Final</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaHistorico">
                        <!-- Registros aparecerão aqui -->
                    </tbody>
                </table>
            </div>
            <button class="btn-danger" onclick="limparHistorico()">Limpar Histórico</button>
        </div>
    </div>

    <script>
        // -- LÓGICA DO RELÓGIO EM TEMPO REAL --
        function atualizarRelogio() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            
            document.getElementById('relogio').innerText = `${horas}:${minutos}:${segundos}`;
        }
        
        // Atualiza a cada 1 segundo (1000 milissegundos)
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio(); // Chama imediatamente para não esperar 1 segundo ao carregar


        // -- LÓGICA DO CÁLCULO DE PONTO --
        const JORNADA_DIARIA = 528; // 8 horas e 48 minutos
        
        function timeToMinutes(timeStr) {
            let parts = timeStr.split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function minutesToTime(minutes) {
            let h = Math.floor(minutes / 60) % 24;
            let m = minutes % 60;
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        }

        function calcularESalvar() {
            let entrada = document.getElementById('entrada').value;
            let saidaAlmoco = document.getElementById('saidaAlmoco').value;
            let retornoAlmoco = document.getElementById('retornoAlmoco').value;

            if (!entrada || !saidaAlmoco || !retornoAlmoco) {
                alert("Por favor, preencha todos os horários.");
                return;
            }

            let minEntrada = timeToMinutes(entrada);
            let minSaidaAlmoco = timeToMinutes(saidaAlmoco);
            let minRetornoAlmoco = timeToMinutes(retornoAlmoco);

            let trabalhadoManha = minSaidaAlmoco - minEntrada;
            
            if (trabalhadoManha < 0) {
                alert("A saída para o almoço deve ser maior que a entrada.");
                return;
            }

            let minutosRestantes = JORNADA_DIARIA - trabalhadoManha;
            let minutoSaidaFinal = minRetornoAlmoco + minutosRestantes;
            let horarioSaida = minutesToTime(minutoSaidaFinal);

            document.getElementById('horaSaidaCalculada').innerText = horarioSaida;
            document.getElementById('resultadoContainer').style.display = 'block';

            salvarNoHistorico(entrada, saidaAlmoco, retornoAlmoco, horarioSaida);
        }

        // -- LÓGICA DE ARMAZENAMENTO NO NAVEGADOR --
        function salvarNoHistorico(entrada, saidaAlmoco, retornoAlmoco, saidaFinal) {
            let hoje = new Date().toLocaleDateString('pt-BR');
            let registro = { data: hoje, entrada, saidaAlmoco, retornoAlmoco, saidaFinal };
            
            let historico = JSON.parse(localStorage.getItem('pontoETB')) || [];
            historico = historico.filter(item => item.data !== hoje);
            historico.unshift(registro); 
            
            if (historico.length > 10) historico.pop();

            localStorage.setItem('pontoETB', JSON.stringify(historico));
            carregarHistorico();
        }

        function carregarHistorico() {
            let historico = JSON.parse(localStorage.getItem('pontoETB')) || [];
            let tbody = document.getElementById('tabelaHistorico');
            tbody.innerHTML = '';

            historico.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.data}</td>
                    <td>${item.entrada}</td>
                    <td>${item.saidaAlmoco}</td>
                    <td>${item.retornoAlmoco}</td>
                    <td><strong>${item.saidaFinal}</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function limparHistorico() {
            if(confirm("Tem certeza que deseja apagar todo o histórico?")) {
                localStorage.removeItem('pontoETB');
                carregarHistorico();
            }
        }

        window.onload = carregarHistorico;
    </script>

</body>
</html>
